<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E - Elite Academy - Trải nghiệm học tập đỉnh cao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#a855f7',
                        google: '#ea4335',
                        facebook: '#1877f2',
                        apple: '#000000',
                        teacher: '#10b981'
                    },
                    borderRadius: { '4xl': '2rem' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }
        .dark .mesh-bg { background-color: #020617; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hover-lift { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-lift:hover { transform: translateY(-8px) scale(1.02); }
        .hidden-view { display: none !important; }
        
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        #toast {
            position: fixed; bottom: 2rem; right: 2rem; transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
        }
        #toast.active { transform: translateY(0); }
        
        .loader-ring { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .typewriter {
            overflow: hidden;
            border-right: .15em solid #6366f1;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: .05em;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #6366f1; } }

        .social-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(8px); z-index: 200; display: none; 
            align-items: center; justify-content: center; padding: 1rem; 
        }
        .social-overlay.active { display: flex; }
    </style>
</head>
<body class="min-h-screen transition-colors duration-500">
    <div class="mesh-bg"></div>

    <!-- Toast -->
    <div id="toast" class="glass px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 dark:text-white border-l-4 border-indigo-600 min-w-[320px]">
        <div id="toast-icon-box" class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center shrink-0 shadow-lg">
            <i id="toast-icon" class="fas fa-info text-white"></i>
        </div>
        <div class="flex flex-col">
            <span id="toast-title" class="font-black text-[10px] uppercase tracking-widest text-indigo-600">SYSTEM</span>
            <span id="toast-msg" class="font-bold text-sm text-slate-700 dark:text-slate-200"></span>
        </div>
    </div>

    <!-- SOCIAL MODAL FORM -->
    <div id="social-modal" class="social-overlay">
        <div class="w-full max-w-md glass p-8 rounded-[2.5rem] shadow-2xl animate__animated animate__zoomIn">
            <div class="flex justify-between items-start mb-6">
                <div id="social-form-header" class="flex items-center gap-4">
                    <div id="social-form-icon" class="w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl shadow-lg"></div>
                    <div>
                        <h4 id="social-form-title" class="font-black text-xl dark:text-white tracking-tight">Social Login</h4>
                        <p id="social-form-subtitle" class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Connect your account</p>
                    </div>
                </div>
                <button onclick="closeSocialModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form onsubmit="handleSocialAuth(event)" class="space-y-4">
                <div class="space-y-1">
                    <label id="lbl-social-user" class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Email / Username</label>
                    <input type="text" required class="w-full bg-slate-100 dark:bg-slate-800/50 rounded-xl px-5 py-3 outline-none dark:text-white font-bold text-sm focus:ring-2 ring-indigo-500/50 transition-all">
                </div>
                <div class="space-y-1">
                    <label id="lbl-social-pass" class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Password</label>
                    <input type="password" required class="w-full bg-slate-100 dark:bg-slate-800/50 rounded-xl px-5 py-3 outline-none dark:text-white font-bold text-sm focus:ring-2 ring-indigo-500/50 transition-all">
                </div>
                <button type="submit" id="social-submit-btn" class="w-full py-4 rounded-xl text-white font-black uppercase text-[10px] tracking-widest shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-2">
                    <span id="social-submit-text">Continue</span>
                </button>
            </form>
        </div>
    </div>

    <!-- TOP NAV -->
    <nav class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-[100]">
        <div onclick="logout()" class="flex items-center gap-2 group cursor-pointer">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-12 transition-transform">
                <i class="fas fa-graduation-cap text-white text-lg"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter dark:text-white">MOOC<span class="text-indigo-600">PRO</span></span>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative group">
                <button class="glass px-4 py-2 rounded-xl flex items-center gap-2 font-bold text-sm dark:text-white shadow-sm hover:border-indigo-500 transition-all">
                    <span id="lang-flag" class="text-lg">🇻🇳</span>
                    <span id="lang-display">VN</span>
                    <i class="fas fa-chevron-down text-[10px] opacity-50 group-hover:rotate-180 transition-transform"></i>
                </button>
                <div class="absolute right-0 mt-2 w-48 glass rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 overflow-hidden z-[110] border border-white/20">
                    <div class="p-2 space-y-1">
                        <button onclick="setLanguage('vi')" class="w-full px-4 py-3 rounded-xl text-left text-sm font-semibold hover:bg-indigo-600 hover:text-white transition-colors flex items-center gap-3"><span>🇻🇳</span> Tiếng Việt</button>
                        <button onclick="setLanguage('en')" class="w-full px-4 py-3 rounded-xl text-left text-sm font-semibold hover:bg-indigo-600 hover:text-white transition-colors flex items-center gap-3"><span>🇺🇸</span> English</button>
                    </div>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="glass w-10 h-10 rounded-xl flex items-center justify-center dark:text-white shadow-sm transition-all"><i id="theme-icon" class="fas fa-moon"></i></button>
        </div>
    </nav>

    <!-- ROLE VIEW -->
    <main id="role-view" class="min-h-screen flex flex-col items-center justify-center p-6 pt-24">
        <div class="text-center mb-12 animate__animated animate__fadeInDown">
            <span class="px-4 py-2 bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 rounded-full text-[10px] font-black uppercase tracking-[0.3em] mb-4 inline-block">Premium MOOC</span>
            <h1 id="role-title" class="text-4xl md:text-5xl font-black text-slate-900 dark:text-white mb-2 tracking-tighter"></h1>
            <div class="max-w-fit mx-auto overflow-hidden"><p id="role-slogan" class="typewriter text-indigo-600 dark:text-indigo-400 font-bold italic text-sm md:text-lg mb-6"></p></div>
            <p id="role-subtitle" class="text-slate-500 dark:text-slate-400 text-sm md:text-base max-w-lg mx-auto font-medium"></p>
        </div>
        
        <!-- Updated Grid for 3 Roles -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl">
            <!-- Student -->
            <div onclick="selectRole('user')" class="hover-lift cursor-pointer glass p-8 rounded-[2.5rem] group animate__animated animate__fadeInLeft">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg mb-6"><i class="fas fa-user-graduate text-2xl text-white"></i></div>
                <h3 id="role-user-text" class="text-2xl font-black dark:text-white mb-2"></h3>
                <p id="role-user-desc" class="text-slate-500 dark:text-slate-400 text-sm mb-6"></p>
                <div class="flex items-center gap-2 text-indigo-600 text-sm font-black group-hover:gap-4 transition-all"><span id="enter-text"></span><i class="fas fa-arrow-right text-[10px]"></i></div>
            </div>
            
            <!-- Teacher (New Role) -->
            <div onclick="selectRole('teacher')" class="hover-lift cursor-pointer glass p-8 rounded-[2.5rem] group animate__animated animate__fadeInUp">
                <div class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center shadow-lg mb-6"><i class="fas fa-chalkboard-teacher text-2xl text-white"></i></div>
                <h3 id="role-teacher-text" class="text-2xl font-black dark:text-white mb-2"></h3>
                <p id="role-teacher-desc" class="text-slate-500 dark:text-slate-400 text-sm mb-6"></p>
                <div class="flex items-center gap-2 text-emerald-500 text-sm font-black group-hover:gap-4 transition-all"><span id="teacher-enter-text"></span><i class="fas fa-arrow-right text-[10px]"></i></div>
            </div>

            <!-- Admin -->
            <div onclick="selectRole('admin')" class="hover-lift cursor-pointer glass p-8 rounded-[2.5rem] group animate__animated animate__fadeInRight">
                <div class="w-16 h-16 bg-slate-900 dark:bg-white rounded-2xl flex items-center justify-center shadow-lg mb-6"><i class="fas fa-user-shield text-2xl text-slate-100 dark:text-slate-900"></i></div>
                <h3 id="role-admin-text" class="text-2xl font-black dark:text-white mb-2"></h3>
                <p id="role-admin-desc" class="text-slate-500 dark:text-slate-400 text-sm mb-6"></p>
                <div class="flex items-center gap-2 text-slate-900 dark:text-white text-sm font-black group-hover:gap-4 transition-all"><span id="admin-text"></span><i class="fas fa-arrow-right text-[10px]"></i></div>
            </div>
        </div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
    selectRole('admin');
});
    </script>
    <!-- AUTH VIEW -->
    <div id="auth-view" class="hidden-view min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-[850px] flex flex-col md:flex-row glass rounded-[3rem] shadow-2xl overflow-hidden animate__animated animate__zoomIn">
            <div id="auth-panel" class="md:w-[35%] p-10 text-white flex flex-col justify-between relative">
                <div>
                    <button onclick="backToRole()" class="mb-10 flex items-center gap-2 font-bold text-[10px] opacity-80 hover:opacity-100 uppercase tracking-widest"><i class="fas fa-chevron-left"></i> <span id="back-text"></span></button>
                    <div class="animate-float mb-6"><i id="role-main-icon" class="fas text-5xl"></i></div>
                    <h2 id="panel-title" class="text-3xl font-black mb-4"></h2>
                    <p id="panel-desc" class="text-xs opacity-80 font-medium leading-relaxed"></p>
                </div>
                <div class="mt-8">
                    <button id="toggle-auth-btn" onclick="toggleAuthMode()" class="w-full py-3 px-6 border border-white/30 rounded-xl text-[10px] font-black hover:bg-white hover:text-slate-900 transition-all flex justify-between items-center group uppercase tracking-widest"><span id="toggle-text"></span><i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform"></i></button>
                </div>
            </div>
            <div class="md:w-[65%] p-8 md:p-12 flex flex-col justify-center">
                <div class="max-w-sm mx-auto w-full">
                    <div class="mb-8"><h3 id="form-title" class="text-3xl font-black dark:text-white mb-2 uppercase"></h3><p id="form-subtitle" class="text-slate-500 dark:text-slate-400 text-sm font-medium"></p></div>
                    <form onsubmit="handleAuth(event)" class="space-y-4">
                        <div id="name-box" class="hidden space-y-1">
                            <label id="lbl-name" class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2"></label>
                            <input type="text" id="reg-name" class="w-full bg-slate-100 dark:bg-slate-800/50 rounded-xl px-5 py-3 outline-none dark:text-white font-bold text-sm focus:ring-2 ring-indigo-500/50 transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2">Email</label>
                            <input type="email" id="auth-email" required class="w-full bg-slate-100 dark:bg-slate-800/50 rounded-xl px-5 py-3 outline-none dark:text-white font-bold text-sm focus:ring-2 ring-indigo-500/50 transition-all">
                        </div>
                        <div class="space-y-1">
                            <label id="lbl-pass" class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-2"></label>
                            <div class="relative">
                                <input type="password" id="auth-pass" required class="w-full bg-slate-100 dark:bg-slate-800/50 rounded-xl px-5 py-3 outline-none dark:text-white font-bold text-sm focus:ring-2 ring-indigo-500/50 transition-all">
                                <button type="button" onclick="togglePass()" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400"><i id="eye-icon" class="fas fa-eye text-sm"></i></button>
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-black shadow-lg hover:-translate-y-1 transition-all uppercase tracking-[0.2em] text-[10px] mt-4 flex items-center justify-center gap-3"><span id="submit-btn-text"></span></button>
                    </form>
                    <div id="social-login" class="mt-8 text-center">
                        <p id="social-text" class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-400 mb-6 italic"></p>
                        <div class="flex justify-center gap-4">
                            <button onclick="openSocialModal('Google')" class="w-14 h-14 glass rounded-2xl flex items-center justify-center hover:bg-white hover:text-google transition-all border border-slate-200 dark:border-slate-700 group"><i class="fab fa-google text-lg transition-transform group-hover:scale-110"></i></button>
                            <button onclick="openSocialModal('Facebook')" class="w-14 h-14 glass rounded-2xl flex items-center justify-center hover:bg-white hover:text-facebook transition-all border border-slate-200 dark:border-slate-700 group"><i class="fab fa-facebook-f text-lg transition-transform group-hover:scale-110"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const langs = {
            vi: {
                flag: '🇻🇳', name: 'VN',
                slogan: 'Kiến thức là hạt giống, hành động là mùa màng.',
                roleTitle: 'Mở khóa <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Kiến thức</span>',
                roleSubtitle: 'Hệ thống học tập chuyên nghiệp dành cho bạn.',
                roleUser: 'Học viên', roleUserDesc: 'Tham gia lớp học và nhận chứng chỉ.',
                roleTeacher: 'Giáo viên', roleTeacherDesc: 'Giảng dạy và quản lý lộ trình học tập.',
                roleAdmin: 'Quản trị viên', roleAdminDesc: 'Quản lý hệ thống và người dùng.',
                enter: 'VÀO HỌC', teacherBtn: 'GIẢNG DẠY', adminBtn: 'QUẢN TRỊ',
                back: 'Trở về', welcome: 'Chào mừng!', panelDesc: 'Phát triển bản thân cùng MOOC Pro.',
                login: 'Đăng nhập', register: 'Đăng ký', subtitle: 'Nhập thông tin truy cập của bạn.',
                lblPass: 'Mật khẩu', lblName: 'Họ tên', btnConfirm: 'Xác nhận',
                toggleReg: 'Đăng ký ngay', toggleLog: 'Đã có tài khoản?', social: 'Hoặc kết nối qua',
                toastLoad: 'Đang kết nối...', toastSuccess: 'Thành công!', toastError: 'Lỗi xác thực',
                socialTitle: 'Đăng nhập với', socialSub: 'Sử dụng tài khoản mạng xã hội của bạn',
                socialBtn: 'Tiếp tục với', socialUser: 'Email hoặc Tài khoản', socialPass: 'Mật khẩu'
            },
            en: {
                flag: '🇺🇸', name: 'EN',
                slogan: 'Knowledge is seed, action is harvest.',
                roleTitle: 'Unlock <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Knowledge</span>',
                roleSubtitle: 'Professional learning system designed for you.',
                roleUser: 'Student', roleUserDesc: 'Join classes and get certificates.',
                roleTeacher: 'Teacher', roleTeacherDesc: 'Teach and manage learning paths.',
                roleAdmin: 'Administrator', roleAdminDesc: 'Manage system and users.',
                enter: 'START LEARNING', teacherBtn: 'START TEACHING', adminBtn: 'ADMIN PANEL',
                back: 'Back', welcome: 'Welcome!', panelDesc: 'Grow yourself with MOOC Pro.',
                login: 'Login', register: 'Register', subtitle: 'Enter your access details.',
                lblPass: 'Password', lblName: 'Full Name', btnConfirm: 'Confirm',
                toggleReg: 'Register now', toggleLog: 'Have an account?', social: 'Or connect via',
                toastLoad: 'Connecting...', toastSuccess: 'Success!', toastError: 'Auth Error',
                socialTitle: 'Login with', socialSub: 'Use your social account',
                socialBtn: 'Continue with', socialUser: 'Email or Username', socialPass: 'Password'
            }
        };

        let currentLang = 'vi';
        let isLogin = true;
        let currentRole = 'user';
        let activeSocial = '';

        function setLanguage(l) {
            currentLang = l;
            const d = langs[l];
            document.getElementById('lang-flag').innerText = d.flag;
            document.getElementById('lang-display').innerText = d.name;
            document.getElementById('role-title').innerHTML = d.roleTitle;
            document.getElementById('role-subtitle').innerText = d.roleSubtitle;
            
            document.getElementById('role-user-text').innerText = d.roleUser;
            document.getElementById('role-user-desc').innerText = d.roleUserDesc;
            document.getElementById('role-teacher-text').innerText = d.roleTeacher;
            document.getElementById('role-teacher-desc').innerText = d.roleTeacherDesc;
            document.getElementById('role-admin-text').innerText = d.roleAdmin;
            document.getElementById('role-admin-desc').innerText = d.roleAdminDesc;
            
            document.getElementById('enter-text').innerText = d.enter;
            document.getElementById('teacher-enter-text').innerText = d.teacherBtn;
            document.getElementById('admin-text').innerText = d.adminBtn;
            
            const sloganEl = document.getElementById('role-slogan');
            sloganEl.innerText = d.slogan;
            sloganEl.style.animation = 'none'; sloganEl.offsetHeight; sloganEl.style.animation = null;

            document.getElementById('back-text').innerText = d.back;
            document.getElementById('panel-title').innerText = d.welcome;
            document.getElementById('panel-desc').innerText = d.panelDesc;
            document.getElementById('form-title').innerText = isLogin ? d.login : d.register;
            document.getElementById('form-subtitle').innerText = d.subtitle;
            document.getElementById('lbl-name').innerText = d.lblName;
            document.getElementById('lbl-pass').innerText = d.lblPass;
            document.getElementById('submit-btn-text').innerText = d.btnConfirm;
            document.getElementById('toggle-text').innerText = isLogin ? d.toggleReg : d.toggleLog;
            document.getElementById('social-text').innerText = d.social;

            document.getElementById('social-form-subtitle').innerText = d.socialSub;
            document.getElementById('lbl-social-user').innerText = d.socialUser;
            document.getElementById('lbl-social-pass').innerText = d.socialPass;
        }

        function selectRole(r) {
            currentRole = r;
            document.getElementById('role-view').classList.add('hidden-view');
            document.getElementById('auth-view').classList.remove('hidden-view');
            
            const panel = document.getElementById('auth-panel');
            const icon = document.getElementById('role-main-icon');
            const toggleBtn = document.getElementById('toggle-auth-btn');

            if(r === 'admin') {
                panel.className = "md:w-[35%] p-10 text-white flex flex-col justify-between relative bg-slate-900";
                icon.className = "fas fa-user-shield text-5xl";
            } else if (r === 'teacher') {
                panel.className = "md:w-[35%] p-10 text-white flex flex-col justify-between relative bg-emerald-600";
                icon.className = "fas fa-chalkboard-teacher text-5xl";
            } else {
                panel.className = "md:w-[35%] p-10 text-white flex flex-col justify-between relative bg-indigo-600";
                icon.className = "fas fa-user-graduate text-5xl";
            }
            
            document.getElementById('social-login').classList.toggle('hidden', r === 'admin');
        }

        function toggleAuthMode() {
            isLogin = !isLogin;
            const d = langs[currentLang];
            document.getElementById('name-box').classList.toggle('hidden', isLogin);
            document.getElementById('form-title').innerText = isLogin ? d.login : d.register;
            document.getElementById('toggle-text').innerText = isLogin ? d.toggleReg : d.toggleLog;
        }

        function backToRole() { 
            document.getElementById('auth-view').classList.add('hidden-view'); 
            document.getElementById('role-view').classList.remove('hidden-view'); 
        }

        function togglePass() { 
            const i = document.getElementById('auth-pass'); 
            i.type = i.type === 'password' ? 'text' : 'password'; 
            document.getElementById('eye-icon').className = i.type === 'password' ? 'fas fa-eye text-sm' : 'fas fa-eye-slash text-sm'; 
        }

        function showToast(title, msg, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title.toUpperCase();
            document.getElementById('toast-msg').innerText = msg;
            const iconBox = document.getElementById('toast-icon-box');
            const icon = document.getElementById('toast-icon');
            
            iconBox.className = "w-10 h-10 rounded-full flex items-center justify-center shrink-0 shadow-lg " + 
                (type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-indigo-600');
            icon.className = type === 'success' ? 'fas fa-check text-white' : type === 'error' ? 'fas fa-times text-white' : 'fas fa-spinner fa-spin text-white';
            
            toast.classList.add('active');
